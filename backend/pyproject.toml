[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agora-backend"
version = "0.1.0"
description = "Collective Reasoning Platform (Agora) — backend"
readme = "README.md"
requires-python = ">=3.12"
# Every dependency below is named in memory-bank/techContext.md §1. Adding one that is not
# there requires updating that table first (rule R-6: docs and code in the same commit).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    "redis>=5.0",
    "minio>=7.2",
    "nats-py>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "temporalio>=1.32,<2",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "cryptography>=50.0.1",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.13,<5",
    "z3-solver>=4.12,<5",
    "mcp==1.30.0",
    "pyjwt>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "types-openpyxl>=3.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Config is normative; `ruff check app tests` must be clean.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "ASYNC", "RUF", "TRY", "PT"]
ignore = [
    "TRY003", # long messages outside the exception class are fine here
    "TRY300", # the "else after try" shape fights the adapter error-wrapping idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy — strict everywhere; looseness is confined to adapters by config, not by convention.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# Third-party SDKs without shipped stubs. tests/test_layering.py proves these names can
# only ever appear under app/adapters/, so the looseness cannot reach the domain.
module = [
    "mcp.*",
    "jwt.*",
    "nats.*",
    "minio.*",
    "asyncpg.*",
    "pgvector.*",
    "prometheus_client.*",
    "temporalio.*",
    "z3.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the docker compose stack (deselect with '-m \"not integration\"')",
    "contract: adapter must-pass contract suite (see docs/PORTS.md §16)",
]
