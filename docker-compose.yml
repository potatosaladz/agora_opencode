name: agora_opencode

x-backend-environment: &backend-environment
  ENVIRONMENT: dev
  SERVICE_NAME: api
  CODE_VERSION: dev
  EVENT_BUS: nats
  NATS_URL: nats://nats:4222
  WORKFLOW_ENGINE: temporal
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  CACHE: redis
  REDIS_URL: redis://redis:6379/0
  OBJECT_STORE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  MINIO_SECURE: "false"
  MINIO_BUCKET: agora-artifacts
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: agora
  POSTGRES_USER: agora
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  SYMBOLIC_REASONER: z3
  SYMBOLIC_TIMEOUT_MS: ${SYMBOLIC_TIMEOUT_MS:-5000}
  LOG_FORMAT: json

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/agora-artifacts

  nats:
    image: nats:2.10.29-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-14222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-18222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TEMPORAL_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:?set TEMPORAL_POSTGRES_PASSWORD in .env}
      POSTGRES_SEEDS: temporal-postgres
      DEFAULT_NAMESPACE: default
      DEFAULT_NAMESPACE_RETENTION: 24h
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-17233}:7233"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - temporal operator cluster health --address temporal:7233 | grep -q SERVING
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-13000}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-18080}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: agora_opencode/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: agora_opencode/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    networks:
      - default
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  workflow-worker:
    image: agora_opencode/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.composition.workflow_worker"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: workflow-worker
      MCP_GATEWAY_ENDPOINT: http://mcp-gateway:8010/mcp
      MCP_WORKLOAD_SECRET: ${MCP_WORKLOAD_SECRET:?set MCP_WORKLOAD_SECRET in .env}
    networks:
      - default
      - provider_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy

  mcp-gateway:
    image: agora_opencode/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.composition.mcp_gateway"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: mcp-gateway
      MCP_FIXTURE_ENDPOINT: http://mcp-fixture:8020/mcp
      MCP_WORKLOAD_SECRET: ${MCP_WORKLOAD_SECRET:?set MCP_WORKLOAD_SECRET in .env}
    networks:
      - default
      - mcp_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      mcp-fixture:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8010/ready', timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  mcp-fixture:
    image: agora_opencode/backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.composition.mcp_fixture"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: mcp-fixture
    networks:
      - mcp_egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8020/health', timeout=3).read()
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  frontend:
    image: agora_opencode/frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
networks:
  default:
    name: agora_opencode_application_internal
    internal: true
  provider_egress:
    name: agora_opencode_provider_egress
  mcp_egress:
    name: agora_opencode_mcp_egress
    internal: true

volumes:

  postgres-data:
  minio-data:
  nats-data:
  temporal-postgres-data: